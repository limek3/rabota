<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Город — прототип</title>
<style>
/* ── токены (как в CRM) ── */
:root, :root[data-theme="light"] {
  --bg: #f3f2f8; --panel: #ffffff; --line: #e7e5ef; --text: #17152b; --sub: #5e5b74; --dim: #8f8ca5; --ink: 23 21 43;
  --brand: #6a45f5; --brand-soft: #8466ff; --green: #0f7a48; --green-bg: #e7f6ee; --amber: #b56a00; --amber-bg: #fff4e2;
  --gold1: #ffcf5a; --gold2: #f0a43a;
  --glass: rgba(255, 255, 255, 0.66); --glass-strong: rgba(255, 255, 255, 0.82); --glass-bd: rgba(255, 255, 255, 0.7); --glass-ln: rgba(23, 21, 43, 0.08);
  --shadow: 0 20px 50px -18px rgba(40, 30, 90, 0.35);
  --sky1: #bfdcff; --sky2: #e9f2ff; --sky3: #fbf4ea;
}
:root[data-theme="dark"] {
  --bg: #0d0c16; --panel: #191823; --line: #282736; --text: #edecf4; --sub: #a3a1b6; --dim: #737188; --ink: 237 236 244;
  --brand: #8466ff; --brand-soft: #a58dff; --green: #5fd39a; --green-bg: color-mix(in srgb, #5fd39a 13%, #191823); --amber: #ecbb62; --amber-bg: color-mix(in srgb, #ecbb62 13%, #191823);
  --gold1: #ffd46b; --gold2: #f0a43a;
  --glass: rgba(26, 24, 44, 0.62); --glass-strong: rgba(26, 24, 44, 0.84); --glass-bd: rgba(255, 255, 255, 0.07); --glass-ln: rgba(255, 255, 255, 0.07);
  --shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.75);
  --sky1: #0b0c26; --sky2: #1a1640; --sky3: #2a1d45;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.glass { background: var(--glass); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: var(--shadow), inset 0 0 0 1px var(--glass-bd), inset 0 0 0 1px var(--glass-ln); }
.brick { display: inline-block; width: 1.05em; height: .72em; border-radius: 2px; vertical-align: -0.04em; background:
  linear-gradient(#0000 45%, rgba(0,0,0,.18) 45% 55%, #0000 55%), linear-gradient(90deg, #0000 48%, rgba(0,0,0,.18) 48% 52%, #0000 52%) 0 0 / 100% 50% no-repeat, linear-gradient(135deg, #f08a4b, #c9532c);
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.15); }

/* ── шапка ── */
.top { position: relative; z-index: 40; display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 9px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.logo i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-style: normal; background: linear-gradient(135deg, var(--brand), #b06bff); color: #fff; font-size: 17px; box-shadow: 0 6px 14px -6px var(--brand); }
.pills { display: flex; gap: 6px; margin-left: 8px; }
.pill { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px 0 6px; border: 0; border-radius: 12px; background: rgb(var(--ink) / .04); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: box-shadow .15s, background .15s; }
.pill:hover { background: rgb(var(--ink) / .07); }
.pill.on { background: color-mix(in srgb, var(--c) 10%, var(--panel)); box-shadow: inset 0 0 0 1.5px var(--c); }
.pill b { font-size: 13px; }
.pill small { display: block; font-size: 10.5px; color: var(--dim); margin-top: -1px; }
.ring { width: 28px; height: 28px; flex: none; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: rgb(var(--ink) / .1); }
.ring .fg { stroke: var(--c); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s; }
.season { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; background: rgb(var(--ink) / .04); box-shadow: inset 0 0 0 1px var(--line); color: var(--sub); font-weight: 600; font-size: 12.5px; }
.season b { color: var(--text); }
.wallet { margin-left: auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 8px; border-radius: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--gold1) 30%, var(--panel)), color-mix(in srgb, var(--gold2) 22%, var(--panel))); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold2) 45%, transparent); }
.wallet .wi { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.55); font-size: 20px; }
.wallet .wi .brick { font-size: 22px; }
.wallet b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.wallet small { display: block; font-size: 11px; color: var(--sub); margin-top: -2px; }
.wallet .plus { color: var(--green); font-weight: 700; }
.wallet.bump .wi { animation: bump .5s cubic-bezier(.2,1.6,.3,1); }
@keyframes bump { 40% { transform: scale(1.25) rotate(-8deg); } }
.tbtn { height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: rgb(var(--ink) / .05); box-shadow: inset 0 0 0 1px var(--line); color: var(--sub); font-weight: 600; cursor: pointer; }
.tbtn.on { color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }

/* ── сцена: небо, мир (карта), стеклянные панели поверх ── */
.stage { position: relative; height: calc(100vh - 62px); overflow: hidden; }
.sky { position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 0%, var(--sky2) 0%, var(--sky1) 45%, var(--sky3) 100%); transition: background .8s; }
.cloud { position: absolute; border-radius: 50%; background: rgba(255,255,255,.75); filter: blur(18px); animation: drift linear infinite; opacity: .8; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
[data-theme="dark"] .cloud { background: rgba(120,110,200,.18); }
.stars { position: absolute; inset: 0; opacity: 0; transition: opacity .8s;
  background-image: radial-gradient(1.4px 1.4px at 12% 18%, #fff, #0000), radial-gradient(1px 1px at 28% 8%, #fff, #0000), radial-gradient(1.6px 1.6px at 46% 22%, #fff, #0000), radial-gradient(1px 1px at 63% 12%, #fff, #0000), radial-gradient(1.4px 1.4px at 78% 26%, #fff, #0000), radial-gradient(1px 1px at 88% 9%, #fff, #0000), radial-gradient(1.2px 1.2px at 6% 42%, #fff, #0000), radial-gradient(1px 1px at 94% 44%, #fff, #0000), radial-gradient(1.3px 1.3px at 36% 34%, #fff, #0000), radial-gradient(1px 1px at 70% 38%, #fff, #0000); animation: twinkle 4s ease-in-out infinite; }
@keyframes twinkle { 50% { filter: brightness(.6); } }
.moon { position: absolute; right: 9%; top: 8%; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fffbe6, #f4e3a8 60%, #d9c27a); box-shadow: 0 0 40px 10px rgba(255,236,170,.25); opacity: 0; transform: translateY(20px); transition: opacity .8s, transform .8s; }
.sun { position: absolute; right: 9%; top: 6%; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #fff7d6 0%, #ffe39a 40%, rgba(255,214,120,0) 70%); transition: opacity .8s; }
[data-theme="dark"] .stars { opacity: 1; }
[data-theme="dark"] .moon { opacity: 1; transform: none; }
[data-theme="dark"] .sun { opacity: 0; }

.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .8s cubic-bezier(.22,.9,.25,1); will-change: transform; }
.world .base { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; transition: filter .8s; filter: drop-shadow(0 30px 40px rgba(40,30,90,.25)); }
[data-theme="dark"] .world .base { filter: brightness(.6) saturate(1.15) contrast(1.06) hue-rotate(-8deg) drop-shadow(0 30px 50px rgba(0,0,0,.6)); }

/* здание: силуэт + стройка/готовое + леса + табличка */
.b { position: absolute; transform: translate(-50%, 0); cursor: pointer; transition: transform .3s cubic-bezier(.2,1.3,.3,1); }
.b img { display: block; width: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.b .ghost { position: relative; filter: grayscale(1) brightness(1.2) contrast(.75); opacity: .2; transition: opacity .4s; }
.b .real, .b .stg, .b .scaf { position: absolute; inset: 0; }
.b .real { clip-path: inset(var(--clip, 100%) 0 0 0); transition: clip-path 1s cubic-bezier(.22,.9,.3,1), filter .4s; }
.b .stg { opacity: 0; transition: opacity .5s; }
.b .scaf { opacity: 0; transition: opacity .4s; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; clip-path: inset(0 0 calc(100% - var(--clip, 100%)) 0);
  background: repeating-linear-gradient(0deg, transparent 0 9px, rgba(150,98,40,.85) 9px 11px), repeating-linear-gradient(90deg, transparent 0 13px, rgba(120,78,30,.7) 13px 15px), rgba(235,220,195,.35); }
.b[data-st="build"]:not(.has-stg) .scaf { opacity: 1; }
.b.has-stg[data-st="build"] .stg { opacity: 1; }
.b.has-stg[data-st="build"] .real, .b.has-stg[data-st="build"] .scaf { opacity: 0; }
.b.has-stg[data-st="build"] .ghost { opacity: 0; }
.b[data-st="done"] .ghost { opacity: 0; }
.b:hover { transform: translate(-50%, -6px); }
.b:hover :is(.real, .stg), .b.sel :is(.real, .stg) { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--brand) 60%, transparent)); }
.b[data-st="lock"]:hover .ghost, .b.sel[data-st="lock"] .ghost { opacity: .45; }
[data-theme="dark"] .b :is(.real, .stg) { filter: brightness(.8) saturate(1.1) drop-shadow(0 0 12px rgba(255,190,90,.35)); }
[data-theme="dark"] .b .ghost { filter: grayscale(1) brightness(.95); }
.crane { position: absolute; right: 2%; top: -6%; width: 34%; opacity: 0; transition: opacity .4s; pointer-events: none; }
.crane .jib { transform-origin: 22px 14px; animation: crane 3.2s ease-in-out infinite; }
@keyframes crane { 50% { transform: rotate(-10deg); } }
.b[data-st="build"]:not(.has-stg) .crane { opacity: 1; }
/* бейдж над зданием */
.tag { position: absolute; left: 50%; top: var(--tagY, 30%); transform: translate(-50%, -100%); display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 5px; border-radius: 99px; white-space: nowrap; font-size: 11.5px; font-weight: 800; pointer-events: none; transition: opacity .3s, transform .3s; background: var(--glass-strong); backdrop-filter: blur(10px); box-shadow: 0 6px 16px -8px rgba(0,0,0,.45), inset 0 0 0 1px var(--glass-ln); }
.tag .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; background: rgb(var(--ink) / .08); }
.tag .mr { width: 18px; height: 18px; }
.tag .mr circle { fill: none; stroke-width: 3.2; }
.tag .mr .bg { stroke: rgb(var(--ink) / .14); } .tag .mr .fg { stroke: var(--gold2); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.b[data-st="lock"] .tag { color: var(--sub); }
.b[data-st="done"] .tag { opacity: 0; transform: translate(-50%, -80%); }
.b[data-st="done"]:hover .tag, .b[data-st="done"].sel .tag { opacity: 1; transform: translate(-50%, -100%); }
.b.pop :is(.real, .stg) { animation: pop .9s cubic-bezier(.2,1.5,.3,1); }
@keyframes pop { 0% { transform: scale(.9) translateY(8%); } 60% { transform: scale(1.06) translateY(-3%); } 100% { transform: none; } }
.dust { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: rgba(215,195,165,.9); pointer-events: none; z-index: 2000; animation: dust 1.1s ease-out forwards; }
@keyframes dust { to { transform: translate(var(--dx), var(--dy)) scale(2.8); opacity: 0; } }
.flybrick { position: fixed; z-index: 300; font-size: 18px; pointer-events: none; }

/* ── HUD: карточка города (слева сверху) ── */
.hud { position: absolute; left: 18px; top: 18px; z-index: 30; width: 270px; padding: 14px 16px; border-radius: 20px; }
.hud .h { display: flex; align-items: center; gap: 12px; }
.hud .big { width: 58px; height: 58px; flex: none; position: relative; }
.hud .big svg { width: 100%; height: 100%; }
.hud .big circle { fill: none; stroke-width: 6; }
.hud .big .bg { stroke: rgb(var(--ink) / .1); } .hud .big .fg { stroke: url(#gGold); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .8s; }
.hud .big span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.hud h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.hud h2 i { width: 10px; height: 10px; border-radius: 50%; }
.lvl { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 800; color: #5b3a00; background: linear-gradient(120deg, #fff1b8, #ffd65c 50%, #f5b52e); }
.hud small { color: var(--sub); font-size: 12px; }
.hud .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.hud .stats div { padding: 8px 10px; border-radius: 12px; background: rgb(var(--ink) / .05); }
.hud .stats b { display: block; font-size: 16px; font-weight: 800; }
.hud .stats span { font-size: 11px; color: var(--dim); }
.ro { position: absolute; left: 50%; top: 18px; z-index: 30; transform: translateX(-50%); padding: 8px 14px; border-radius: 12px; font-weight: 650; color: var(--sub); }
.ro[hidden] { display: none; }

/* ── лента событий (слева снизу) ── */
.feed { position: absolute; left: 18px; bottom: 150px; z-index: 30; width: 270px; display: flex; flex-direction: column; gap: 6px; }
.ev { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; font-size: 12px; color: var(--sub); animation: evIn .4s cubic-bezier(.2,1.2,.3,1); }
.ev b { color: var(--text); }
.ev .av { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 800; }
@keyframes evIn { from { opacity: 0; transform: translateX(-12px); } }

/* ── док: лента строительства (снизу) ── */
.dock { position: absolute; left: 50%; bottom: 16px; z-index: 30; transform: translateX(-50%); max-width: calc(100% - 36px); display: flex; gap: 8px; padding: 10px; border-radius: 22px; overflow-x: auto; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.card { position: relative; flex: none; width: 96px; padding: 6px 6px 8px; border: 0; border-radius: 16px; background: rgb(var(--ink) / .04); box-shadow: inset 0 0 0 1px var(--glass-ln); cursor: pointer; text-align: center; transition: transform .2s cubic-bezier(.2,1.3,.3,1), box-shadow .15s, background .15s; }
.card:hover { transform: translateY(-4px); background: rgb(var(--ink) / .07); }
.card.on { box-shadow: inset 0 0 0 2px var(--brand), 0 10px 22px -10px var(--brand); background: color-mix(in srgb, var(--brand) 8%, transparent); }
.card .th { height: 62px; display: grid; place-items: center; }
.card .th img { width: 76px; }
.card[data-st="lock"] .th img { filter: grayscale(1) opacity(.5); }
.card b { display: block; font-size: 11.5px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--dim); font-weight: 700; }
.card .pb { height: 4px; margin: 5px 6px 0; border-radius: 2px; background: rgb(var(--ink) / .1); overflow: hidden; }
.card .pb i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold1)); border-radius: 2px; }
.card .ok { position: absolute; right: 6px; top: 6px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; font-size: 10px; font-weight: 900; }
.card .lk { position: absolute; right: 6px; top: 6px; font-size: 11px; opacity: .7; }

/* ── панель здания (справа) ── */
.drawer { position: absolute; right: 18px; top: 18px; bottom: 150px; z-index: 35; width: 360px; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 30px)); opacity: 0; transition: transform .5s cubic-bezier(.2,1.1,.3,1), opacity .3s; }
.drawer.on { transform: none; opacity: 1; }
.dr-x { position: absolute; right: 12px; top: 12px; z-index: 2; width: 32px; height: 32px; border: 0; border-radius: 10px; background: rgb(var(--ink) / .07); cursor: pointer; font-size: 18px; color: var(--sub); }
.dr-x:hover { color: var(--text); background: rgb(var(--ink) / .12); }
.dr-hero { position: relative; height: 200px; flex: none; display: grid; place-items: center; background: radial-gradient(60% 70% at 50% 60%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 70%); }
.dr-hero img { width: 210px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.25)); animation: float 4s ease-in-out infinite; }
.dr-hero[data-st="lock"] img { filter: grayscale(1) opacity(.45) drop-shadow(0 18px 24px rgba(0,0,0,.2)); }
@keyframes float { 50% { transform: translateY(-6px); } }
.dr-body { flex: 1; overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.dr-t { display: flex; align-items: center; gap: 10px; }
.dr-t h3 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
.st { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 800; }
.st.lock { color: var(--sub); background: rgb(var(--ink) / .07); } .st.build { color: var(--amber); background: var(--amber-bg); } .st.done { color: var(--green); background: var(--green-bg); }
.prog .nums { display: flex; align-items: baseline; justify-content: space-between; }
.prog .nums b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.prog .nums b small { font-size: 14px; color: var(--dim); font-weight: 700; }
.prog .nums span { color: var(--sub); font-size: 12px; }
.track { position: relative; height: 12px; margin-top: 8px; border-radius: 6px; background: rgb(var(--ink) / .08); }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--gold2), var(--gold1)); box-shadow: 0 0 12px -2px var(--gold2); transition: width .8s cubic-bezier(.22,.9,.3,1); }
.track u { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: rgb(var(--ink) / .25); }
.steps { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--dim); font-weight: 600; }
.steps .on { color: var(--amber); }
.prize { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: linear-gradient(120deg, color-mix(in srgb, var(--brand) 14%, transparent), color-mix(in srgb, #ec4899 10%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 25%, transparent); }
.prize .e { font-size: 22px; }
.prize b { display: block; font-size: 12.5px; }
.prize small { color: var(--sub); font-size: 11.5px; }
.inv { padding: 12px; border-radius: 16px; background: rgb(var(--ink) / .04); box-shadow: inset 0 0 0 1px var(--glass-ln); display: flex; flex-direction: column; gap: 10px; }
.inv .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); font-weight: 600; }
.inv input[type=range] { width: 100%; accent-color: var(--gold2); }
.inv .qs { display: flex; gap: 6px; }
.inv .q { flex: 1; height: 30px; border: 0; border-radius: 9px; background: rgb(var(--ink) / .05); box-shadow: inset 0 0 0 1px var(--glass-ln); font-weight: 800; cursor: pointer; }
.inv .q:hover { background: rgb(var(--ink) / .09); }
.go { height: 46px; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--gold1), var(--gold2)); color: #3d2400; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 10px 22px -10px var(--gold2), inset 0 1px 0 rgba(255,255,255,.5); transition: transform .12s, filter .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.go:hover { filter: brightness(1.05); transform: translateY(-1px); }
.go:disabled { filter: grayscale(.9); opacity: .45; cursor: default; transform: none; }
.inv .note { font-size: 11.5px; color: var(--dim); text-align: center; }
.h4 { margin: 0 0 8px; font-size: 11px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: end; }
.podium div { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px; background: rgb(var(--ink) / .04); text-align: center; }
.podium .p1 { padding-top: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--gold1) 25%, transparent), rgb(var(--ink) / .03)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold2) 35%, transparent); }
.podium .m { font-size: 18px; }
.podium .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; box-shadow: 0 0 0 2px var(--panel); }
.podium b { font-size: 11.5px; line-height: 1.2; }
.podium small { font-size: 11px; font-weight: 800; color: var(--amber); }

<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd65c"/><stop offset="1" stop-color="#f08a2b"/></linearGradient></defs></svg>

<script>
/* ── картинки: в автономной версии вшиты (window.IMG), иначе — из public/city ── */
const IMG = window.IMG || null;

function probeStages(onDone) {

/* ── здания: участок (центр ромба в пикселях картинки 1536×1024, ширина) и цена ── */
const B = [
  { id: "cafe",      name: "Кофейня",         e: "☕", price: 20,  x: 617,  y: 690, w: 195, tile: [0.501, 0.68] },
  { id: "flowers",   name: "Цветочная лавка", e: "💐", price: 30,  x: 777,  y: 697, w: 170, tile: [0.5, 0.68] },

  { id: "service",   name: "Автосервис",      e: "🔧", price: 60,  x: 373,  y: 355, w: 220, tile: [0.5, 0.676] },
  { id: "autosalon", name: "Автосалон",       e: "🚗", price: 80,  x: 1293, y: 527, w: 262, tile: [0.502, 0.707] },

  { id: "hotel",     name: "Отель",           e: "🏨", price: 120, x: 625,  y: 196, w: 270, tile: [0.504, 0.731] },
  { id: "office",    name: "Бизнес-центр",    e: "🏢", price: 150, x: 927,  y: 196, w: 250, tile: [0.501, 0.745] },
  { id: "stadium",   name: "Стадион",         e: "🏟", price: 200, x: 782,  y: 470, w: 335, tile: [0.501, 0.594], prize: ["Короткая пятница", "вся группа уходит на час раньше"] },
];
const TOTAL = B.reduce((a, b) => a + b.price, 0);
const OPS = [["Диникаев А.", "#f97316"], ["Сапаров Ш.", "#10b981"], ["Гимранова А.", "#3b82f6"], ["Рахимов А.", "#ec4899"], ["Девиченская А.", "#a855f7"], ["Усанин Д.", "#06b6d4"], ["Клочко З.", "#ef4444"], ["Хадаев Б.", "#84cc16"]];
const color = (who) => (OPS.find((o) => o[0] === who) || [0, "#888"])[1];

const ME = "Диникаев А.";
const G = {
  a: { name: "Альфа", color: "#ec4899", inv: { cafe: 20, flowers: 30, shop: 40, pizza: 34, service: 12 } },
  b: { name: "Бета",  color: "#a855f7", inv: { cafe: 20, flowers: 30, shop: 40, pizza: 50, service: 60, autosalon: 55, bank: 18 } },
  c: { name: "Гамма", color: "#3b82f6", inv: { cafe: 20, flowers: 14 } },
};
const MY = "a";
for (const g of Object.values(G)) {
  g.by = {};
  for (const [id, n] of Object.entries(g.inv)) { let left = n, k = id.length; const m = {}; while (left > 0) { const who = OPS[(k++ * 3) % OPS.length][0]; const part = Math.min(left, 2 + ((k * 7) % 9)); m[who] = (m[who] || 0) + part; left -= part; } g.by[id] = m; }
}
let wallet = 12, cur = MY, sel = null, qty = 5;
const events = [["Сапаров Ш.", "вложил(а) 6", "pizza"], ["Гимранова А.", "вложил(а) 3", "pizza"], ["Диникаев А.", "вложил(а) 8", "service"]];
const st = (g, b) => { const n = g.inv[b.id] || 0; return n >= b.price ? "done" : n > 0 ? "build" : "lock"; };
const ring = (pct, cls = "ring", r = 11) => { const c = 2 * Math.PI * r; return `<svg class="${cls}" viewBox="0 0 ${2 * r + 6} ${2 * r + 6}"><circle class="bg" cx="${r + 3}" cy="${r + 3}" r="${r}"/><circle class="fg" cx="${r + 3}" cy="${r + 3}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/></svg>`; };

/* ── мир: картинка квартала и здания ── */
const stage = document.getElementById("stage"), world = document.getElementById("world");
document.getElementById("base").src = src("city-base");
const els = {};
for (const b of B) {
  const el = document.createElement("div");
  el.className = "b"; el.dataset.id = b.id;
  el.innerHTML = `<img class="ghost" src="${src(b.id)}" alt=""><img class="stg" alt=""><img class="real" src="${src(b.id)}" alt="${b.name}">
    <div class="scaf" style="-webkit-mask-image:url(${src(b.id)});mask-image:url(${src(b.id)})"></div>
    <svg class="crane" viewBox="0 0 80 90" aria-hidden="true"><path d="M18 88V14h8v74z" fill="#e8a83a"/><path d="M18 88V14l8 8M26 30l-8 8M18 46l8 8M26 62l-8 8" stroke="#9a5f12" stroke-width="1.6" fill="none"/><g class="jib"><path d="M6 12h70v6H6z" fill="#f0b44a"/><path d="M22 4l-14 8M22 4l50 8" stroke="#9a5f12" stroke-width="1.6"/><path d="M62 18v26" stroke="#555" stroke-width="1.2"/><rect x="57" y="44" width="10" height="7" rx="1" fill="#b0603a"/></g><rect x="12" y="84" width="20" height="5" rx="1" fill="#6b6b6b"/></svg>
    <span class="tag"></span>`;
  el.addEventListener("click", (e) => { e.stopPropagation(); if (!document.body.classList.contains("editing")) pick(b.id); });
  world.append(el); els[b.id] = el;
}
function place() {
  for (const b of B) {
    const el = els[b.id];
    el.style.width = `${(b.w / 1536) * 100}%`;
    el.style.left = `${((b.x + (0.5 - b.tile[0]) * b.w) / 1536) * 100}%`;
    el.style.top = `${((b.y - b.tile[1] * b.w) / 1024) * 100}%`;
    el.style.zIndex = String(Math.round(b.y));
    el.style.setProperty("--tagY", `${Math.max(8, (b.tile[1] - 0.42) * 100)}%`);
  }
}
/* камера: мир вписан в сцену; выбрали здание — плавно подлетаем к нему (левее панели) */
let fit = { w: 0, h: 0, x: 0, y: 0 };
function layout() {
  const W = stage.clientWidth, H = stage.clientHeight - 130;
  const w = Math.min(W * 0.92, H * 1.5 * 0.98), h = w / 1.5;
  fit = { w, h, x: (W - w) / 2, y: Math.max(10, (H - h) / 2 + 6) };
  world.style.width = `${w}px`; world.style.height = `${h}px`;
  camera();
}
function camera() {
  if (!sel) { world.style.transform = `translate(${fit.x}px, ${fit.y}px) scale(1)`; return; }
  const b = B.find((x) => x.id === sel); const s = b.id === "stadium" ? 1.35 : 1.6;
  const W = stage.clientWidth, H = stage.clientHeight - 130;
  const cx = (b.x / 1536) * fit.w, cy = ((b.y - b.w * 0.25) / 1024) * fit.h;
  const focusX = (W - 380) / 2, focusY = H / 2;
  world.style.transform = `translate(${focusX - cx * s}px, ${focusY - cy * s}px) scale(${s})`;
}
addEventListener("resize", layout);
stage.addEventListener("click", (e) => { if (!e.target.closest(".b, .drawer, .dock, .hud, .feed") && sel) { sel = null; render(); } });
addEventListener("keydown", (e) => { if (e.key === "Escape" && sel) { sel = null; render(); } });

/* ── отрисовка ── */
function render() {
  const g = G[cur];
  for (const b of B) {
    const el = els[b.id], n = Math.min(b.price, g.inv[b.id] || 0), s = st(g, b), p = n / b.price;
    el.dataset.st = s; el.classList.toggle("sel", b.id === sel);
    el.style.setProperty("--clip", `${100 - p * 100}%`);
    const stg = STAGE[b.id] && (STAGE[b.id][p < 0.5 ? 1 : 2] || STAGE[b.id][1] || STAGE[b.id][2]);
    el.classList.toggle("has-stg", !!stg);
    if (stg) el.querySelector(".stg").src = stg;
    el.querySelector(".tag").innerHTML = s === "done" ? `<span class="ic">${b.e}</span>${b.name}` : s === "build" ? `${ring(p, "mr", 7)}<span class="num">${n}/${b.price}</span>` : `<span class="ic">🔒</span><span class="num">${b.price}</span><span class="brick"></span>`;
  }
  const done = B.filter((b) => st(g, b) === "done").length, bricks = Object.values(g.inv).reduce((a, n) => a + n, 0);
  document.getElementById("hud").innerHTML = `<div class="h"><div class="big">${ring(done / B.length, "", 24).replace('<svg class=""', "<svg")}<span>${done}/${B.length}</span></div>
    <div><h2><i style="background:${g.color}"></i>${g.name} <span class="lvl">★ ${done + 1}</span></h2><small>${cur === MY ? "ваша группа" : "город соседей"} · сезон октябрь</small></div></div>
    <div class="stats"><div><b class="num">${bricks}</b><span>вложено <span class="brick"></span></span></div><div><b class="num">${Math.round((bricks / TOTAL) * 100)}%</b><span>города построено</span></div></div>`;
  document.getElementById("ro").hidden = cur === MY;
  document.getElementById("wallet").textContent = wallet;
  document.getElementById("pills").innerHTML = Object.entries(G).map(([k, gg]) => { const d = B.filter((b) => st(gg, b) === "done").length; return `<button class="pill${k === cur ? " on" : ""}" style="--c:${gg.color}" data-g="${k}" type="button">${ring(d / B.length)}<span><b>${gg.name}</b><small>${d}/${B.length}${k === MY ? " · ваша" : ""}</small></span></button>`; }).join("");
  document.querySelectorAll(".pill").forEach((p) => (p.onclick = () => { cur = p.dataset.g; sel = null; render(); }));
  document.getElementById("dock").innerHTML = B.map((b) => { const n = Math.min(b.price, g.inv[b.id] || 0), s = st(g, b); return `<button class="card${b.id === sel ? " on" : ""}" data-id="${b.id}" data-st="${s}" type="button">${s === "done" ? '<span class="ok">✓</span>' : s === "lock" ? '<span class="lk">🔒</span>' : ""}<div class="th"><img src="${(s === "build" && STAGE[b.id] && (STAGE[b.id][n / b.price < 0.5 ? 1 : 2])) || src(b.id)}" alt=""></div><b>${b.name}</b><small>${s === "done" ? "построено" : `<span class="num">${n}/${b.price}</span> <span class="brick"></span>`}</small><div class="pb"><i style="width:${(n / b.price) * 100}%"></i></div></button>`; }).join("");
  document.querySelectorAll(".card").forEach((c) => (c.onclick = (e) => { e.stopPropagation(); pick(c.dataset.id); }));
  document.getElementById("feed").innerHTML = events.slice(0, 3).map(([who, what, id]) => { const b = B.find((x) => x.id === id); return `<div class="ev glass"><span class="av" style="background:${color(who) || g.color}">${who.startsWith(G[cur].name) ? "🎉" : ini(who)}</span><span><b>${who}</b> ${what} ${b ? `· ${b.e} ${b.name}` : ""}</span></div>`; }).join("");
  renderDrawer(); camera();
}
function renderDrawer() {
  const d = document.getElementById("drawer");
  if (!sel) { d.classList.remove("on"); return; }
  const g = G[cur], b = B.find((x) => x.id === sel), n = Math.min(b.price, g.inv[b.id] || 0), s = st(g, b), p = n / b.price, need = b.price - n;
  const mine = cur === MY, max = Math.min(wallet, need);
  qty = Math.max(1, Math.min(qty, max || 1));
  const by = Object.entries(g.by[b.id] || {}).sort((a, c) => c[1] - a[1]);
  const pic = (s === "build" && STAGE[b.id] && STAGE[b.id][p < 0.5 ? 1 : 2]) || src(b.id);
  const pod = [by[1], by[0], by[2]];
  d.classList.add("on");
  d.innerHTML = `<button class="dr-x" id="drx" type="button" aria-label="Закрыть">×</button>
    <div class="dr-hero" data-st="${s}"><img src="${pic}" alt=""></div>
    <div class="dr-body">
      <div><div class="dr-t"><h3>${b.e} ${b.name}</h3><span class="st ${s}">${s === "done" ? "✓ Построено" : s === "build" ? "🏗 Строится" : "🔒 Закрыто"}</span></div></div>
      <div class="prog"><div class="nums"><b class="num">${n}<small> / ${b.price}</small></b><span>${s === "done" ? "готово" : `ещё <b class="num">${need}</b> <span class="brick"></span>`}</span></div>
        <div class="track"><i style="width:${p * 100}%"></i><u style="left:50%"></u></div>
        <div class="steps"><span class="${p > 0 && p < 0.5 ? "on" : ""}">Каркас</span><span class="${p >= 0.5 && p < 1 ? "on" : ""}">Стены</span><span class="${p >= 1 ? "on" : ""}">Готово</span></div></div>
      ${b.prize ? `<div class="prize"><span class="e">🎁</span><div><b>${b.prize[0]}</b><small>${b.prize[1]}</small></div></div>` : ""}
      ${mine && s !== "done" ? `<div class="inv"><div class="lab"><span>Вложить</span><span>у вас <b class="num">${wallet}</b> <span class="brick"></span></span></div>
        ${max > 0 ? `<input type="range" id="rng" min="1" max="${max}" value="${qty}"><div class="qs">${[1, 5, 10].map((v) => `<button class="q" data-q="${v}" type="button">${v}</button>`).join("")}<button class="q" data-q="${max}" type="button">Всё</button></div>` : ""}
        <button class="go" id="go" type="button" ${max > 0 ? "" : "disabled"}>Вложить <span class="num" id="goq">${max > 0 ? qty : 0}</span> <span class="brick"></span></button>
        <div class="note">${max > 0 ? "вложенное не возвращается — оно навсегда в городе" : "кирпичей нет — доведите лид, и они появятся"}</div></div>` : !mine ? `<div class="empty">Это город группы «${g.name}» — вкладывать можно только в свой</div>` : ""}
      <div><div class="h4">Строители</div>${by.length ? `<div class="podium">${pod.map((x, i) => x ? `<div class="${i === 1 ? "p1" : ""}"><span class="m">${["🥈", "🥇", "🥉"][i]}</span><span class="av" style="background:${color(x[0])}">${ini(x[0])}</span><b>${x[0]}${x[0] === ME ? "<br>(вы)" : ""}</b><small class="num">${x[1]} 🧱</small></div>` : "<div style='visibility:hidden'></div>").join("")}</div>
        ${by.length > 3 ? `<div class="rest">${by.slice(3).map(([w, v]) => `<div><span class="av" style="width:18px;height:18px;border-radius:50%;background:${color(w)}"></span>${w}<span class="n num">${v}</span></div>`).join("")}</div>` : ""}` : '<div class="empty">Пока никто не вложился — станьте первым строителем 👷</div>'}</div>
    </div>`;
  document.getElementById("drx").onclick = (e) => { e.stopPropagation(); sel = null; render(); };

}
function pick(id) { sel = sel === id ? null : id; render(); }

/* ── вложение: кирпичи дугой летят из кошелька в здание ── */
function invest(b, n) {
  if (!n) return;
  const g = G[cur], from = document.querySelector(".wallet .wi").getBoundingClientRect(), to = els[b.id].getBoundingClientRect();
  const fly = Math.min(n, 12);
  for (let i = 0; i < fly; i++) {
    const k = document.createElement("span"); k.className = "flybrick"; k.innerHTML = '<span class="brick"></span>';
    k.style.left = `${from.left + 6}px`; k.style.top = `${from.top + 8}px`; document.body.append(k);
    const tx = to.left + to.width / 2 - from.left + (Math.random() - 0.5) * 40, ty = to.top + to.height * 0.55 - from.top;
    k.animate([{ transform: "translate(0,0) scale(1) rotate(0)" }, { transform: `translate(${tx * 0.45}px, ${ty * 0.4 - 140}px) scale(1.5) rotate(${180 + i * 30}deg)`, offset: 0.5 }, { transform: `translate(${tx}px, ${ty}px) scale(.5) rotate(360deg)`, opacity: 0.3 }],
      { duration: 800 + i * 30, delay: i * 60, easing: "cubic-bezier(.3,.6,.3,1)", fill: "forwards" }).onfinish = () => k.remove();
  }
  wallet -= n;
  const box = document.getElementById("walletBox"); box.classList.remove("bump"); void box.offsetWidth; box.classList.add("bump");
  document.getElementById("wallet").textContent = wallet;
  const was = st(g, b);
  setTimeout(() => {
    g.inv[b.id] = (g.inv[b.id] || 0) + n; g.by[b.id] = g.by[b.id] || {}; g.by[b.id][ME] = (g.by[b.id][ME] || 0) + n;
    events.unshift([ME, `вложил(а) ${n}`, b.id]); render();
    if (was !== "done" && st(g, b) === "done") built(b);
  }, 800 + fly * 60);
}

/* ── достроено: отскок, пыль, конфетти, тост ── */
function built(b) {
  const el = els[b.id]; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 18; i++) {
    const d = document.createElement("span"); d.className = "dust"; d.style.position = "fixed";
    d.style.left = `${r.left + r.width / 2}px`; d.style.top = `${r.top + r.height * 0.75}px`;
    d.style.setProperty("--dx", `${(Math.random() - 0.5) * r.width}px`); d.style.setProperty("--dy", `${(Math.random() - 0.7) * 60}px`);
    document.body.append(d); setTimeout(() => d.remove(), 1200);
  }
  const C = ["#ffc83d", "#f97316", "#ef4444", "#ec4899", "#a855f7", "#3b82f6", "#10b981"];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement("i"); c.className = "conf"; c.style.left = `${Math.random() * 100}vw`; const s = 6 + Math.random() * 6;
    c.style.width = `${s}px`; c.style.height = `${s * 0.45}px`; c.style.background = C[i % C.length];
    c.style.setProperty("--dx", `${(Math.random() - 0.5) * 160}px`); c.style.setProperty("--r", `${(Math.random() - 0.5) * 1080}deg`);
    c.style.animationDuration = `${3.6 + Math.random() * 2.2}s`; c.style.animationDelay = `${Math.random() * 1.6}s`;
    document.body.append(c); setTimeout(() => c.remove(), 8000);
  }
  const t = document.getElementById("toast"), top = Object.entries(G[cur].by[b.id]).sort((a, c) => c[1] - a[1])[0];
  t.querySelector("img").src = src(b.id);
  t.querySelector("b").textContent = `${G[cur].name} открыла «${b.name}»!`;
  t.querySelector("small").textContent = b.prize ? `🎁 ${b.prize[0]} · главный строитель — ${top[0]}` : `Главный строитель — ${top[0]} 👑`;
  t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 5000);
  events.unshift([`${G[cur].name} открыла`, "", b.id]); render();
}

/* ── облака ── */
const sky = document.querySelector(".sky");
for (let i = 0; i < 6; i++) { const c = document.createElement("i"); c.className = "cloud"; const w = 160 + Math.random() * 200; c.style.width = `${w}px`; c.style.height = `${w * 0.35}px`; c.style.top = `${4 + Math.random() * 40}%`; c.style.animationDuration = `${70 + Math.random() * 60}s`; c.style.animationDelay = `${-Math.random() * 120}s`; sky.append(c); }

/* ── тема ── */
const themeBtn = document.getElementById("theme");
themeBtn.onclick = () => { const d = document.documentElement.dataset.theme === "dark"; document.documentElement.dataset.theme = d ? "light" : "dark"; themeBtn.textContent = d ? "☾ Ночь" : "☀︎ День"; };

/* ── разметка: перетащить здание, колесо — масштаб ── */
const editBtn = document.getElementById("edit"), out = document.getElementById("editout");
editBtn.onclick = () => { const on = document.body.classList.toggle("editing"); editBtn.classList.toggle("on", on); sel = null; render(); dump(); };
function dump() { out.textContent = B.map((b) => `${b.id.padEnd(10)} x ${Math.round(b.x)}  y ${Math.round(b.y)}  w ${Math.round(b.w)}`).join("\n"); }
let drag = null;
world.addEventListener("pointerdown", (e) => { if (!document.body.classList.contains("editing")) return; const el = e.target.closest(".b"); if (!el) return; const b = B.find((x) => x.id === el.dataset.id); drag = { b, sx: e.clientX, sy: e.clientY, x: b.x, y: b.y, k: 1536 / fit.w }; world.setPointerCapture(e.pointerId); });
world.addEventListener("pointermove", (e) => { if (!drag) return; drag.b.x = drag.x + (e.clientX - drag.sx) * drag.k; drag.b.y = drag.y + (e.clientY - drag.sy) * drag.k; place(); dump(); });
world.addEventListener("pointerup", () => (drag = null));
world.addEventListener("wheel", (e) => { if (!document.body.classList.contains("editing")) return; const el = e.target.closest(".b"); if (!el) return; e.preventDefault(); const b = B.find((x) => x.id === el.dataset.id); b.w = Math.max(60, b.w * (e.deltaY < 0 ? 1.03 : 0.97)); place(); dump(); }, { passive: false });

place(); layout(); probeStages(render); render();
</script>
