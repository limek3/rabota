<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Бегун и призрак — доработка</title>
<style>
/* ── токены как в CRM (app/theme.css) ── */
:root, :root[data-theme="light"] {
  --bg: #f3f2f8; --panel: #ffffff; --sunken: #f6f5fb; --line: #e7e5ef; --line2: #dcd9e7;
  --text: #17152b; --sub: #5e5b74; --dim: #8f8ca5; --ink: 23 21 43;
  --brand: #6a45f5; --brand-soft: #8466ff;
  --green: #0f7a48; --green-bg: #e7f6ee; --green-bd: #c0e6d0;
  --amber: #9c5800; --amber-bg: #fff4e2; --amber-bd: #f6dcae;
  --red: #cc2f47; --red-bg: #fdecef; --red-bd: #f6c9d1;
  --gold: #c8901a; --on-c: #fff;
}
:root[data-theme="dark"] {
  --bg: #111019; --panel: #191823; --sunken: #14131d; --line: #282736; --line2: #32313f;
  --text: #edecf4; --sub: #a3a1b6; --dim: #737188; --ink: 237 236 244;
  --brand: #8466ff; --brand-soft: #a58dff;
  --green: #5fd39a; --green-bg: color-mix(in srgb, #5fd39a 12%, #191823); --green-bd: color-mix(in srgb, #5fd39a 30%, #191823);
  --amber: #ecbb62; --amber-bg: color-mix(in srgb, #ecbb62 12%, #191823); --amber-bd: color-mix(in srgb, #ecbb62 32%, #191823);
  --red: #ff8596; --red-bg: color-mix(in srgb, #ff8596 13%, #191823); --red-bd: color-mix(in srgb, #ff8596 30%, #191823);
  --gold: #f0c35a; --on-c: #111019;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
b { font-variant-numeric: tabular-nums; }

/* ── шапка стенда ── */
.top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 24px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 16px; font-weight: 800; }
.top p { margin: 0; color: var(--dim); font-size: 12px; }
.sp { flex: 1; }
.tabs { display: flex; max-width: 100%; overflow-x: auto; gap: 3px; padding: 3px; border-radius: 10px; background: rgb(var(--ink) / .05); box-shadow: inset 0 0 0 1px var(--line); }
.tabs button { height: 28px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: var(--sub); font-weight: 600; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 0 0 1px var(--line); }
.replay { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); font-weight: 700; font-size: 12.5px; cursor: pointer; }
.facts { padding: 10px 24px 0; color: var(--sub); font-size: 12px; }
.facts b { color: var(--text); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 24px 60px; display: grid; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px 20px; overflow: hidden; }
.card h2 { margin: 0; font-size: 14px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
.card h2 i { font-style: normal; color: var(--brand); font-size: 12px; font-weight: 800; }
.card .idea { margin: 3px 0 18px; color: var(--sub); font-size: 12px; max-width: 780px; }
.stage { margin: 0 auto; width: 100%; transition: max-width .3s; }
body.narrow .stage { max-width: 380px; }
@media (max-width: 640px) { .top { padding: 12px 16px; } .facts { padding: 10px 16px 0; } .wrap { padding: 14px 16px 40px; } .card { padding: 14px 14px 16px; } }

/* ── ряд подписей без наложений (раскладывает JS) ── */
.row { position: relative; }
.lb { position: absolute; top: 0; white-space: nowrap; font-size: 11px; color: var(--sub); line-height: 1.15; }
.lb.dropped { top: 22px !important; }
.ok { color: var(--green) !important; }
.bad { color: var(--red) !important; }

/* ── фигурка бегуна ── */
.fig { width: 18px; height: 18px; flex: none; overflow: visible; }
.fig * { stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig circle { fill: currentColor; stroke: none; }
.fig .leg, .fig .arm { transform-box: view-box; }
.fig .l1, .fig .l2 { transform-origin: 11px 13px; }
.fig .a1, .fig .a2 { transform-origin: 12.5px 8.5px; }
.running .fig .l1, .running .fig .a2 { animation: swing .32s ease-in-out infinite alternate; }
.running .fig .l2, .running .fig .a1 { animation: swing .32s ease-in-out infinite alternate-reverse; }
@keyframes swing { from { transform: rotate(-28deg); } to { transform: rotate(24deg); } }
.running .bob { animation: bob .16s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-1.5px); } }

/* въезд: из нуля на своё место */
.anim .mv { animation: slide 1.3s cubic-bezier(.22, .9, .25, 1) both; }
.anim .gr { animation: grow 1.3s cubic-bezier(.22, .9, .25, 1) both; }
.anim .fade { animation: fadein .5s 1.1s both; }
@keyframes slide { from { left: 0; } }
@keyframes grow { from { width: 0; } }
@keyframes fadein { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .anim .mv, .anim .gr, .anim .fade, .running .fig *, .running .bob { animation: none !important; } }

/* фишки: бегун (факт) и призрак (должно быть) */
.runner { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 99px; background: var(--c); color: var(--on-c); font-size: 12.5px; font-weight: 800; box-shadow: 0 6px 16px -6px var(--c); }
.runner .av { width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, var(--on-c) 20%, transparent); display: grid; place-items: center; }
.runner small { font-weight: 600; opacity: .85; font-size: 11px; }
.runner.caret::after { content: ""; position: absolute; left: var(--off); bottom: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--c); transform: translateX(-50%); }
.ghost { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border-radius: 99px; border: 1.5px dashed rgb(var(--ink) / .32); color: var(--sub); font-size: 12px; font-weight: 700; background: var(--panel); }
.ghost .av { width: 20px; height: 20px; border-radius: 50%; background: rgb(var(--ink) / .06); display: grid; place-items: center; opacity: .75; }
.ghost small { font-weight: 500; color: var(--dim); font-size: 11px; }
.ghost.caret::before { content: ""; position: absolute; left: var(--off); top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: rgb(var(--ink) / .32); transform: translateX(-50%); }
.medal { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #fff; font-size: 11px; margin-left: 2px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 30%, transparent); }
.fin { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--sub); font-weight: 600; }
.fin b { color: var(--text); font-size: 12.5px; }
.chk { width: 12px; height: 12px; border-radius: 2px; background: conic-gradient(var(--text) 25%, var(--panel) 0 50%, var(--text) 0 75%, var(--panel) 0) 0 0 / 6px 6px; box-shadow: 0 0 0 1px rgb(var(--ink) / .25); }

/* ═══ A. Стадион ═══ */
.va .row.up { height: 40px; }
.va .row.dn { height: 44px; }
.va .row.up .lb { top: 4px; }
.va .row.dn .lb { top: 9px; }
.va .track { position: relative; height: 30px; border-radius: 8px; background:
    linear-gradient(rgb(var(--ink) / .09), rgb(var(--ink) / .09)) 0 50% / 100% 1px no-repeat,
    color-mix(in srgb, var(--brand) 5%, rgb(var(--ink) / .045)); }
.va .km { position: absolute; top: 0; bottom: 0; width: 1px; background: rgb(var(--ink) / .1); }
.va .km span { position: absolute; bottom: 1px; left: 4px; font-size: 9px; color: var(--dim); font-weight: 600; }
.va .run { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 8px 0 0 8px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 6%, transparent), color-mix(in srgb, var(--c) 30%, transparent)); }
.va .run::after { content: ""; position: absolute; right: 0; top: 4px; bottom: 4px; width: 46px; background: repeating-linear-gradient(90deg, transparent 0 6px, color-mix(in srgb, var(--c) 45%, transparent) 6px 7px); mask: linear-gradient(90deg, transparent, #000); -webkit-mask: linear-gradient(90deg, transparent, #000); }
.va .gapz { position: absolute; top: 9px; bottom: 9px; border-radius: 3px; min-width: 4px; }
.va .gapz.up { background: var(--green); box-shadow: 0 0 10px color-mix(in srgb, var(--green) 50%, transparent); }
.va .gapz.dn { background: repeating-linear-gradient(135deg, var(--red) 0 3px, color-mix(in srgb, var(--red) 45%, transparent) 3px 6px); }
.va .steps { position: absolute; top: 0; bottom: 0; background:
    radial-gradient(ellipse 2.5px 1.6px at 30% 34%, rgb(var(--ink) / .35) 98%, transparent) 0 0 / 14px 30px repeat-x,
    radial-gradient(ellipse 2.5px 1.6px at 80% 66%, rgb(var(--ink) / .35) 98%, transparent) 0 0 / 14px 30px repeat-x; }
.va .finish { position: absolute; top: -4px; bottom: -4px; width: 8px; transform: translateX(-50%); border-radius: 2px; background: conic-gradient(var(--text) 25%, var(--panel) 0 50%, var(--text) 0 75%, var(--panel) 0) 0 0 / 8px 8px; box-shadow: 0 0 0 1px rgb(var(--ink) / .3); }
.va .finish.done { background: conic-gradient(var(--gold) 25%, var(--panel) 0 50%, var(--gold) 0 75%, var(--panel) 0) 0 0 / 8px 8px; }
.va .pos { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); }
.va .pos.me { background: var(--c); border: 2.5px solid var(--panel); box-shadow: 0 0 0 1.5px var(--c); }
.va .pos.gh { border: 1.5px dashed rgb(var(--ink) / .45); background: var(--panel); width: 10px; height: 10px; }
.va .gapl { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; }
.va .gapl.ok { background: var(--green-bg); }
.va .gapl.bad { background: var(--red-bg); }
.va .say { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 4px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--sub); }
.va .say b { color: var(--text); }
.va .say .k { display: inline-flex; align-items: center; gap: 6px; }
.va .say svg { width: 14px; height: 14px; color: var(--dim); }

/* ═══ B. Соперник-график ═══ */
.vb .lanes { position: relative; display: grid; gap: 0; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.vb .lane { position: relative; height: 46px; display: grid; grid-template-columns: 92px 1fr 70px; align-items: center; }
body.narrow .vb .lane { grid-template-columns: 64px 1fr 52px; }
.vb .lane + .lane { border-top: 1px dashed var(--line2); }
.vb .lane:nth-child(1) { background: color-mix(in srgb, var(--c) 6%, transparent); }
.vb .who { padding-left: 12px; font-size: 11.5px; font-weight: 700; color: var(--sub); line-height: 1.15; }
.vb .who small { display: block; font-weight: 500; color: var(--dim); font-size: 10.5px; }
.vb .lt { position: relative; height: 100%; }
.vb .lt::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgb(var(--ink) / .12); }
.vb .bar { position: absolute; left: 0; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 2px; }
.vb .bar.me { background: linear-gradient(90deg, transparent, var(--c)); height: 6px; }
.vb .bar.gh { background: linear-gradient(90deg, transparent, rgb(var(--ink) / .3)); }
.vb .tok { position: absolute; top: 50%; transform: translate(-100%, -50%); }
.vb .tok.l { transform: translate(0, -50%); }
.vb .end { text-align: right; padding-right: 12px; font-size: 15px; font-weight: 800; }
.vb .end small { display: block; font-size: 10.5px; color: var(--dim); font-weight: 500; }
.vb .fl { position: absolute; top: 0; bottom: 0; width: 8px; transform: translateX(-50%); background: conic-gradient(var(--text) 25%, var(--panel) 0 50%, var(--text) 0 75%, var(--panel) 0) 0 0 / 8px 8px; opacity: .85; }
.vb .fc { position: absolute; top: 50%; height: 0; border-top: 2px dotted color-mix(in srgb, var(--c) 70%, transparent); }
.vb .fc::after { content: attr(data-t); position: absolute; right: 0; top: 5px; font-size: 10.5px; color: var(--sub); white-space: nowrap; font-weight: 600; }
.vb .gapbox { position: absolute; right: 70px; top: 50%; transform: translate(50%, -50%); z-index: 2; }
body.narrow .vb .gapbox { right: 52px; }
.vb .gb { display: inline-flex; flex-direction: column; align-items: center; padding: 4px 8px; border-radius: 9px; font-size: 13px; font-weight: 800; line-height: 1.1; background: var(--panel); box-shadow: 0 0 0 1px var(--line2), 0 6px 18px -8px rgb(var(--ink) / .4); }
.vb .gb small { font-size: 9.5px; font-weight: 600; color: var(--dim); }
.vb .cap { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
.vb .cap b { color: var(--text); }

/* ═══ C. Компактный ═══ */
.vc .row.up { height: 36px; }
.vc .row.dn { height: 34px; }
.vc .row.up .lb { top: 2px; }
.vc .row.dn .lb { top: 8px; }
.vc .track { position: relative; height: 10px; border-radius: 6px; background: rgb(var(--ink) / .07); }
.vc .run { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 25%, transparent), var(--c)); }
.vc .gapz { position: absolute; top: -3px; bottom: -3px; border-radius: 3px; min-width: 3px; }
.vc .gapz.up { background: color-mix(in srgb, var(--green) 30%, transparent); box-shadow: inset 0 0 0 1.5px var(--green); }
.vc .gapz.dn { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--red) 55%, transparent) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1.5px var(--red); }
.vc .steps { position: absolute; top: 3px; height: 4px; background: radial-gradient(circle, rgb(var(--ink) / .4) 1.2px, transparent 1.6px) 0 0 / 8px 4px repeat-x; }
.vc .finish { position: absolute; top: -5px; bottom: -5px; width: 6px; transform: translateX(-50%); border-radius: 1px; background: conic-gradient(var(--text) 25%, var(--panel) 0 50%, var(--text) 0 75%, var(--panel) 0) 0 0 / 6px 6px; box-shadow: 0 0 0 1px rgb(var(--ink) / .3); }
.vc .runner { font-size: 12px; padding: 2px 9px 2px 3px; }
.vc .runner .av { width: 21px; height: 21px; }
.vc .ghost { font-size: 11.5px; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Бегун и призрак — доработка</h1>
    <p>Бегун — факт, призрак — сколько должно быть к сегодня, клетчатая черта — план</p>
  </div>
  <span class="sp"></span>
  <div class="tabs" id="scn"></div>
  <div class="tabs" id="wd"><button data-v="wide" class="on">Широко</button><button data-v="narrow">Телефон</button></div>
  <div class="tabs" id="th"><button data-v="light" class="on">Светлая</button><button data-v="dark">Тёмная</button></div>
  <button class="replay" id="replay">▶ Ещё раз</button>
</header>
<div class="facts" id="facts"></div>
<main class="wrap" id="out"></main>

<script>
const SC = {
  now:    { name: "Как сейчас",    plan: 700, fact: 656, day: 20.6, days: 22 },
  behind: { name: "Отстаём",       plan: 700, fact: 540, day: 20.6, days: 22 },
  start:  { name: "Начало месяца", plan: 700, fact: 70,  day: 2.6,  days: 22 },
  over:   { name: "Перевыполнили", plan: 700, fact: 742, day: 20.6, days: 22 },
};
let cur = "now";

const fmt = (n) => Math.round(n).toLocaleString("ru-RU");
const sg = (n) => (Math.round(n) > 0 ? "+" : Math.round(n) < 0 ? "−" : "±") + fmt(Math.abs(n));
const pc = (x) => Math.round(x * 100) + "%";
const f1 = (n) => n.toLocaleString("ru-RU", { maximumFractionDigits: 1 });
const lw = (n) => { const a = Math.abs(Math.round(n)) % 100, b = a % 10; return a > 10 && a < 20 ? "лидов" : b === 1 ? "лид" : b >= 2 && b <= 4 ? "лида" : "лидов"; };

function ctx(s) {
  const should = (s.plan * s.day) / s.days;
  const pace = s.fact / s.day;
  const rr = pace * s.days;
  const max = Math.max(s.plan, rr, s.fact) * 1.02;
  const ok = s.fact >= should - 0.5;
  const left = s.days - s.day;
  return {
    ...s, should, rr, max, ok, pace,
    gap: s.fact - should,
    done: s.fact >= s.plan,
    rrPct: rr / s.plan,
    norm: s.plan / s.days,
    need: left > 0 ? Math.max(0, s.plan - s.fact) / left : null,
    // на какой рабочий день добежим до плана по нынешнему темпу
    finishDay: pace > 0 ? s.plan / pace : Infinity,
    c: ok ? "var(--green)" : "var(--red)",
    cls: ok ? "ok" : "bad",
    p: (v) => Math.max(0, Math.min(100, (v / max) * 100)),
  };
}

const FIG = `<svg class="fig" viewBox="0 0 24 24"><g class="bob"><circle cx="14.2" cy="3.8" r="2.4"/><path d="M13.2 7.2 11 13"/><path class="arm a1" d="M12.5 8.5 9 11"/><path class="arm a2" d="M12.5 8.5 16.4 10.4"/><path class="leg l1" d="M11 13 8.6 17.4 5.6 18.6"/><path class="leg l2" d="M11 13 14.2 16.4 13.6 21"/></g></svg>`;
const ICO = {
  pace: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 14l4-4"/><path d="M3.3 19a9 9 0 1 1 17.4 0"/></svg>`,
  flag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg>`,
  cal:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
};

const lb = (x, html, cls = "", align = "c") => `<div class="lb ${cls}" data-x="${x}" data-al="${align}">${html}</div>`;

/* фраза о финише по темпу */
function finishText(c) {
  if (c.done) return `план взят, сверху <b class="ok">${sg(c.fact - c.plan)}</b>`;
  if (c.finishDay <= c.days) return `по темпу добежим к финишу на <b>${Math.ceil(c.finishDay)}-й</b> рабочий день из ${c.days}`;
  return `по темпу до финиша не хватит <b class="bad">${fmt(c.plan - c.rr)}</b> ${lw(c.plan - c.rr)}`;
}

/* ═══ A. Стадион ═══ */
function va(c) {
  // на узком экране отметок вдвое реже — иначе цифры слипаются
  const step = (c.max > 600 ? 100 : 50) * (document.body.classList.contains("narrow") ? 2 : 1);
  let kms = "";
  for (let v = step; v < c.max; v += step) if (Math.abs(c.p(v) - c.p(c.plan)) > 3) kms += `<div class="km" style="left:${c.p(v)}%"><span>${fmt(v)}</span></div>`;
  const a = c.p(Math.min(c.fact, c.should)), b = c.p(Math.max(c.fact, c.should));
  const gapChip = `<span class="gapl ${c.cls}">${c.ok ? "отрыв" : "отстаём"} ${sg(c.gap)}</span>`;
  const runnerChip = `<span class="runner caret running"><span class="av">${FIG}</span>${fmt(c.fact)}<small>факт</small>${c.done ? `<span class="medal">★</span>` : ""}</span>`;
  return `<div class="va" style="--c:${c.c}">
    <div class="row up">
      ${lb(c.p(c.fact), runnerChip, "mv")}
      ${lb(c.p(c.plan), `<span class="fin"><span class="chk"></span>финиш <b>${fmt(c.plan)}</b></span>`, "", c.p(c.plan) > 90 ? "r" : "c")}
    </div>
    <div class="track">
      ${kms}
      <div class="run gr" style="width:${c.p(c.fact)}%"></div>
      ${c.rr > c.fact ? `<div class="steps fade" style="left:calc(${c.p(c.fact)}% + 10px);width:max(0px, calc(${c.p(c.rr) - c.p(c.fact)}% - 14px))"></div>` : ""}
      <div class="gapz fade ${c.ok ? "up" : "dn"}" style="left:${a}%;width:${b - a}%"></div>
      <div class="finish${c.done ? " done" : ""}" style="left:${c.p(c.plan)}%"></div>
      <div class="pos gh fade" style="left:${c.p(c.should)}%"></div>
      <div class="pos me mv" style="left:${c.p(c.fact)}%"></div>
    </div>
    <div class="row dn">
      ${lb(c.p(c.should), `<span class="ghost caret"><span class="av">${FIG}</span>${fmt(c.should)}<small>должно быть</small></span>`, "fade")}
      ${lb((a + b) / 2, gapChip, "fade")}
      ${c.rr > c.fact && !c.done ? lb(c.p(c.rr), `≈ <b style="color:var(--text);font-size:12px">${fmt(c.rr)}</b> к концу месяца`, "fade") : ""}
    </div>
    <div class="say fade">
      <span class="k">${ICO.pace} темп <b>${f1(c.pace)}</b> в день · норма ${f1(c.norm)}${c.need != null && !c.done ? ` · нужно <b class="${c.need > c.pace ? "bad" : ""}">${f1(c.need)}</b>` : ""}</span>
      <span class="k">${ICO.flag} ${finishText(c)}</span>
      <span class="k">${ICO.cal} день ${Math.ceil(c.day)} из ${c.days}</span>
    </div>
  </div>`;
}

/* ═══ B. Соперник-график ═══ */
function vb(c) {
  const fp = c.p(c.fact), sp = c.p(c.should), pp = c.p(c.plan);
  const tok = (x, html) => `<div class="tok mv ${x < 22 ? "l" : ""}" style="left:${x}%">${html}</div>`;
  return `<div class="vb" style="--c:${c.c}">
    <div class="lanes">
      <div class="lane">
        <div class="who">Мы<small>факт</small></div>
        <div class="lt">
          <div class="bar me gr" style="width:${fp}%"></div>
          ${c.rr > c.fact ? `<div class="fc fade" style="left:${fp}%;width:${c.p(c.rr) - fp}%"></div>` : ""}
          <div class="fl" style="left:${pp}%"></div>
          ${tok(fp, `<span class="runner running"><span class="av">${FIG}</span>${fmt(c.fact)}${c.done ? `<span class="medal">★</span>` : ""}</span>`)}
        </div>
        <div class="end ${c.cls} fade">${sg(c.gap)}<small>${c.ok ? "впереди" : "позади"}</small></div>
      </div>
      <div class="lane">
        <div class="who">График<small>должно быть</small></div>
        <div class="lt">
          <div class="bar gh gr" style="width:${sp}%"></div>
          <div class="fl" style="left:${pp}%"></div>
          ${tok(sp, `<span class="ghost running"><span class="av">${FIG}</span>${fmt(c.should)}</span>`)}
        </div>
        <div class="end">${fmt(c.plan)}<small>финиш</small></div>
      </div>
    </div>
    <div class="cap fade"><span><b>${pc(c.fact / c.plan)}</b> плана · темп <b>${f1(c.pace)}</b>/день, норма ${f1(c.norm)}</span><span>${c.rr > c.fact && !c.done ? `≈ <b>${fmt(c.rr)}</b> к концу месяца · ` : ""}${finishText(c)}</span></div>
  </div>`;
}

/* ═══ C. Компактный — под шапку «Сводки» ═══ */
function vc(c) {
  const a = c.p(Math.min(c.fact, c.should)), b = c.p(Math.max(c.fact, c.should));
  return `<div class="vc" style="--c:${c.c}">
    <div class="row up">
      ${lb(c.p(c.fact), `<span class="runner caret running"><span class="av">${FIG}</span>${fmt(c.fact)} <small>${sg(c.gap)}</small>${c.done ? `<span class="medal">★</span>` : ""}</span>`, "mv")}
      ${lb(c.p(c.plan), `<span class="fin"><span class="chk"></span><b>${fmt(c.plan)}</b></span>`, "", c.p(c.plan) > 90 ? "r" : "c")}
    </div>
    <div class="track">
      <div class="run gr" style="width:${c.p(c.fact)}%"></div>
      ${c.rr > c.fact ? `<div class="steps fade" style="left:calc(${c.p(c.fact)}% + 6px);width:max(0px, calc(${c.p(c.rr) - c.p(c.fact)}% - 8px))"></div>` : ""}
      <div class="gapz fade ${c.ok ? "up" : "dn"}" style="left:${a}%;width:${b - a}%"></div>
      <div class="finish" style="left:${c.p(c.plan)}%"></div>
    </div>
    <div class="row dn">
      ${lb(c.p(c.should), `<span class="ghost caret"><span class="av">${FIG}</span>${fmt(c.should)} <small>должно быть</small></span>`, "fade")}
      ${c.rr > c.fact && !c.done ? lb(c.p(c.rr), `≈ <b style="color:var(--text)">${fmt(c.rr)}</b> к концу`, "fade") : ""}
    </div>
  </div>`;
}

const VARIANTS = [
  ["Стадион", "Беговая дорожка с отметками каждые 100 лидов. Бегун прибегает на своё место, призрак стоит там, где надо быть сегодня, между ними светится отрыв (или штрихуется отставание). Дальше — следы до прогноза, клетчатая финишная черта. Внизу — темп, сколько нужно в день и на какой рабочий день добежим.", va],
  ["Соперник-график", "Две дорожки: «Мы» и «График». Бегут параллельно к одному финишу — у каждого своя дорожка, подписи не пересекаются никогда. Справа — табло отрыва и % плана.", vb],
  ["Компактный — под «Сводку»", "Та же идея в высоту текущей шкалы: бегун с отрывом сверху, призрак снизу, подсвеченный отрыв, следы и клетчатый финиш. Его можно ставить вместо нынешней линии без перестройки шапки.", vc],
];

/* раскладка подписей в ряду: по точке, без наложений; не влезли — каждая вторая строкой ниже */
function layoutRow(row) {
  const W = row.clientWidth, GAP = 8;
  const ms = [...row.querySelectorAll(":scope > .lb")].map((el) => {
    el.classList.remove("dropped");
    const w = el.offsetWidth, x = (parseFloat(el.dataset.x) / 100) * W, al = el.dataset.al;
    const l = al === "l" ? x : al === "r" ? x - w : x - w / 2;
    return { el, w, x, l0: l, l: Math.max(0, Math.min(W - w, l)) };
  }).sort((a, b) => a.x - b.x);
  for (let i = 1; i < ms.length; i++) { const p = ms[i - 1]; if (ms[i].l < p.l + p.w + GAP) ms[i].l = p.l + p.w + GAP; }
  for (let i = ms.length - 1; i >= 0; i--) { const lim = i === ms.length - 1 ? W : ms[i + 1].l - GAP; if (ms[i].l + ms[i].w > lim) ms[i].l = lim - ms[i].w; }
  if (ms.length && ms[0].l < 0) {
    ms.forEach((m) => (m.l = Math.max(0, Math.min(W - m.w, m.l0))));
    ms.forEach((m, i) => { if (i % 2) m.el.classList.add("dropped"); });
  }
  ms.forEach((m) => { m.el.style.left = m.l + "px"; m.el.style.setProperty("--off", Math.max(8, Math.min(m.w - 8, m.x - m.l)) + "px"); });
}

function render(animate = true) {
  const c = ctx(SC[cur]);
  document.getElementById("facts").innerHTML = `Сценарий «${SC[cur].name}»: план <b>${fmt(c.plan)}</b> · факт <b>${fmt(c.fact)}</b> · должно быть к сегодня <b>${fmt(c.should)}</b> · прогноз <b>${fmt(c.rr)}</b> (${pc(c.rrPct)}) · рабочий день ${Math.ceil(c.day)} из ${c.days}`;
  const out = document.getElementById("out");
  out.classList.remove("anim");
  out.innerHTML = VARIANTS.map(([t, idea, fn], i) => `<section class="card"><h2><i>7${"ABC"[i]}</i>${t}</h2><p class="idea">${idea}</p><div class="stage">${fn(c)}</div></section>`).join("");
  document.querySelectorAll(".row").forEach(layoutRow);
  if (animate) {
    void out.offsetWidth;
    out.classList.add("anim");
  }
  // ноги перестают бежать, когда бегун добежал
  clearTimeout(render.t);
  render.t = setTimeout(() => document.querySelectorAll(".running").forEach((e) => e.classList.remove("running")), animate ? 1350 : 0);
}

const scn = document.getElementById("scn");
scn.innerHTML = Object.entries(SC).map(([k, s]) => `<button data-v="${k}" class="${k === cur ? "on" : ""}">${s.name}</button>`).join("");
const tab = (id, on, anim = true) => document.getElementById(id).addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle("on", x === b));
  on(b.dataset.v); render(anim);
});
tab("scn", (v) => (cur = v));
tab("wd", (v) => document.body.classList.toggle("narrow", v === "narrow"), false);
tab("th", (v) => (document.documentElement.dataset.theme = v), false);
document.getElementById("replay").onclick = () => render(true);
addEventListener("resize", () => document.querySelectorAll(".row").forEach(layoutRow));
render();
</script>
</body>
